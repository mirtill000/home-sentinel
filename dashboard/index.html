<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Sentinel — Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-icon" id="icon-brand"></span>
      <span class="brand-text">
        <span class="brand-name">HOME SENTINEL</span>
        <span class="brand-sub">LAN MONITOR</span>
      </span>
    </div>

    <nav class="nav" id="sidebar-nav"></nav>

    <div class="sidebar-spacer"></div>

    <div class="sidebar-footer">
      <span>Home Sentinel v1.0.0</span>
    </div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <div class="topbar-title">
        <span class="topbar-title-icon" id="page-icon"></span>
        <div>
          <h1 id="page-title">Dashboard</h1>
          <p id="page-subtitle">Local network overview</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="cmdk-open" class="btn btn-icon" title="Search pages, devices, alerts… (Ctrl+K)" aria-label="Search">
          <span id="icon-cmdk-open"></span>
        </button>
        <button id="refresh-now" class="btn btn-primary">
          <span id="icon-refresh"></span>Refresh data
        </button>
        <div class="topbar-updated">
          <strong id="last-updated">Never updated</strong>
          <span>last updated</span>
        </div>
        <div class="status-pill-wrap">
          <button class="status-pill" id="status-pill">
            <span class="dot"></span><span id="status-pill-text">Waiting</span>
          </button>
          <div class="status-dropdown hidden" id="status-dropdown"></div>
        </div>
        <div class="theme-toggle-wrap">
          <button id="theme-toggle" class="btn btn-icon" title="Theme" aria-label="Change theme"></button>
          <div class="theme-menu hidden" id="theme-menu"></div>
        </div>
      </div>
    </header>

    <div class="page">
      <div id="error-banner" class="error-banner hidden"></div>
      <main id="view-root"></main>
    </div>
  </div>
</div>

<div id="tooltip" class="tooltip hidden" role="tooltip"></div>

<div id="cmdk-overlay" class="cmdk-overlay hidden">
  <div class="cmdk-box">
    <div class="cmdk-input-row">
      <span id="icon-cmdk"></span>
      <input type="text" id="cmdk-input" placeholder="Search pages, devices, alerts… (Esc to close)">
    </div>
    <div class="cmdk-results" id="cmdk-results"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
